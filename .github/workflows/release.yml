name: Release

# Tags, publishes and creates the GitHub Release after a release PR lands on main.
#
# Versioning happens in the release PR opened by `pnpm release:prepare` (scripts/release/
# prepare.sh, run with gh CLI). The enterprise policy forbids GitHub Actions from opening
# pull requests, so the Changesets bot flow is not used (FND-04). This job only needs to push
# a tag and create a release, which GITHUB_TOKEN may do.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mcp_registry_only:
        description: Publish current server.json to the Official MCP Registry even if git tag already exists
        type: boolean
        default: false

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Tag / publish / GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          version=$(node -p "require('./packages/server/package.json').version")
          tag="@airyschat/mcp@${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "$pending" -gt 0 ]; then
            echo "::notice::${pending} pending changeset(s); run 'pnpm release:prepare' to open the release PR."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif ! grep -qx "## ${version}" packages/server/CHANGELOG.md 2>/dev/null; then
            echo "::notice::No CHANGELOG entry for ${version}; not a release commit."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.decide.outputs.release == 'true'
      - uses: actions/setup-node@v7
        if: steps.decide.outputs.release == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check
        if: steps.decide.outputs.release == 'true'
        run: pnpm install --frozen-lockfile && pnpm check

      # Disabled until FND-11 sets the repository variable PUBLISH_ENABLED=true
      # (GitHub Packages before 1.0, public npm at 1.0 — ADR 0003).
      - name: Publish to GitHub Packages
        if: steps.decide.outputs.release == 'true' && vars.PUBLISH_ENABLED == 'true'
        env:
          GH_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          npmrc="$(mktemp)"
          trap 'rm -f "$npmrc"' EXIT
          printf '@airyschat:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GH_PKG_TOKEN" > "$npmrc"
          if [ "$(NPM_CONFIG_USERCONFIG="$npmrc" npm view "@airyschat/mcp@${VERSION}" version --registry https://npm.pkg.github.com 2>/dev/null || true)" = "$VERSION" ]; then
            echo "@airyschat/mcp@${VERSION} already published to GitHub Packages; skipping."
          else
            NPM_CONFIG_USERCONFIG="$npmrc" pnpm --filter @airyschat/mcp publish --no-git-checks --registry https://npm.pkg.github.com
          fi

      # Public npm with SLSA provenance at 1.0+ when NPM_PUBLIC_ENABLED=true (GA-05).
      # Uses NPM_TOKEN only when present (first-time bootstrap before package exists on npmjs.com);
      # once deleted, npm 11 exchanges the GitHub Actions OIDC token natively via Trusted Publishing.
      - name: Publish to public npm with provenance
        if: steps.decide.outputs.release == 'true' && vars.NPM_PUBLIC_ENABLED == 'true'
        env:
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          if [ "$(npm view "@airyschat/mcp@${VERSION}" version --registry https://registry.npmjs.org/ 2>/dev/null || true)" = "$VERSION" ]; then
            echo "@airyschat/mcp@${VERSION} already published to public npm; skipping."
          elif [ -n "$BOOTSTRAP_NPM_TOKEN" ]; then
            npmrc="$(mktemp)"
            trap 'rm -f "$npmrc"' EXIT
            printf '@airyschat:registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' "$BOOTSTRAP_NPM_TOKEN" > "$npmrc"
            (
              cd packages/server
              NPM_CONFIG_USERCONFIG="$npmrc" npm publish --registry https://registry.npmjs.org/ --access public --provenance
            )
          else
            (
              cd packages/server
              rm -f ~/.npmrc
              npm publish --access public --provenance
            )
            echo "Waiting for npm async indexing of @airyschat/mcp@${VERSION}..."
            for i in $(seq 1 24); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@airyschat%2fmcp/${VERSION}?t=$(date +%s)")" = "200" ]; then
                echo "@airyschat/mcp@${VERSION} is visible on registry.npmjs.org after ~$((i*10))s."
                break
              fi
              sleep 10
            done
          fi

      # Official MCP Registry (`chat.airys/mcp`) when MCP_REGISTRY_PUBLISH_ENABLED=true (GA-06).
      - name: Publish to MCP Registry (chat.airys/mcp)
        if: >-
          (steps.decide.outputs.release == 'true' || inputs.mcp_registry_only == true) &&
          vars.MCP_REGISTRY_PUBLISH_ENABLED == 'true'
        env:
          MCP_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_PRIVATE_KEY }}
        run: |
          trap 'rm -f ./mcp-publisher' EXIT
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher
          ./mcp-publisher validate
          if [ -n "$MCP_DNS_KEY" ]; then
            ./mcp-publisher login dns --domain airys.chat --private-key "$MCP_DNS_KEY"
          else
            ./mcp-publisher login github-oidc
          fi
          ./mcp-publisher publish

      - name: Tag and GitHub Release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          awk -v v="## ${VERSION}" '$0==v{f=1;next} /^## /{f=0} f' packages/server/CHANGELOG.md > /tmp/notes.md
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          prerelease=""
          case "${VERSION}" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "${TAG}" --title "@airyschat/mcp ${VERSION}" --notes-file /tmp/notes.md --verify-tag ${prerelease}
