name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Version Packages / publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@airyschat'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # Opens/updates the "Version Packages" PR while changesets are pending.
      # Publishing stays disabled until FND-11 sets the repository variable
      # PUBLISH_ENABLED=true (GitHub Packages before 1.0, public npm at 1.0 — ADR 0003).
      - name: Changesets
        uses: changesets/action@v1
        with:
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          version: pnpm version-packages
          publish: ${{ vars.PUBLISH_ENABLED == 'true' && 'pnpm release' || '' }}
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
