# Builds the distroless @airyschat/mcp HTTP container image and, once the
# WIF provider and Artifact Registry permissions from REM-07 are applied in
# airys-platform/infra (and vars.GCP_IMAGE_PUSH_ENABLED == 'true'), pushes the
# image to Artifact Registry and deploys Cloud Run service `mcp`.

name: Container Image

on:
  push:
    tags:
      - '@airyschat/mcp@*'
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'packages/server/**'
      - 'scripts/inventory/**'
      - 'docs/api/**'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'packages/server/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (staging builds and deploys; prod promotes staging image)
        type: choice
        options: [staging, prod]
        default: staging
      commit:
        description: Commit SHA to promote to prod (defaults to current HEAD)
        type: string
        required: false

permissions:
  contents: read
  id-token: write

env:
  REGION: southamerica-east1
  SERVICE: mcp

jobs:
  build-verify:
    name: Build & smoke-test distroless image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: airyschat-mcp:test
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify /healthz and /.well-known/oauth-protected-resource in container
        run: |
          docker run -d --name mcp-test -p 18080:8080 \
            -e AIRYSCHAT_DEFAULT_INSTANCE=staging \
            airyschat-mcp:test
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/.well-known/oauth-protected-resource | grep -q 'staging.airys.app'
          docker rm -f mcp-test

  staging:
    name: Push & deploy to staging
    needs: [build-verify]
    if: >-
      vars.GCP_IMAGE_PUSH_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/@airyschat/mcp@')) &&
      (github.event_name != 'workflow_dispatch' || inputs.environment == 'staging')
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-mcp-staging
      cancel-in-progress: false
    env:
      PROJECT_ID: airys-platform-staging
      IMAGE: southamerica-east1-docker.pkg.dev/airys-platform-staging/images/mcp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/807136505272/locations/global/workloadIdentityPools/github/providers/airyschat-mcp
          service_account: deployer@airys-platform-staging.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v4
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy Cloud Run service mcp (staging)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" >/dev/null 2>&1; then
            echo "::warning::No Cloud Run service '$SERVICE' in $PROJECT_ID yet; apply REM-07 Terraform first."
            exit 0
          fi
          gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE@$DIGEST" --quiet

  prod:
    name: Promote & deploy to prod
    if: >-
      vars.GCP_IMAGE_PUSH_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'prod'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-mcp-prod
      cancel-in-progress: false
    env:
      PROJECT_ID: airys-platform-prod
      SOURCE: southamerica-east1-docker.pkg.dev/airys-platform-staging/images/mcp
      IMAGE: southamerica-east1-docker.pkg.dev/airys-platform-prod/images/mcp
      COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/164414754876/locations/global/workloadIdentityPools/github/providers/airyschat-mcp
          service_account: deployer@airys-platform-prod.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - id: copy
        name: Copy staging image into prod registry
        run: |
          docker buildx imagetools create --tag "$IMAGE:$COMMIT" "$SOURCE:$COMMIT"
          digest=$(gcloud artifacts docker images describe "$IMAGE:$COMMIT" \
            --format='value(image_summary.digest)')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy Cloud Run service mcp (prod)
        env:
          DIGEST: ${{ steps.copy.outputs.digest }}
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE@$DIGEST" --quiet
